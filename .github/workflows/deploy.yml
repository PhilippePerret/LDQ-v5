name: Deploy to AlwaysData

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test (e2e)
        run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: "Label de qualité"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy over SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist public package.json package-lock.json
          remote_path: ${{ secrets.ALWAYSDATA_DEPLOY_PATH }}
          remote_host: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          remote_user: ${{ secrets.ALWAYSDATA_SSH_USER }}
          remote_key: ${{ secrets.ALWAYSDATA_SSH_KEY }}

      - name: Install production dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          username: ${{ secrets.ALWAYSDATA_SSH_USER }}
          key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            cd ${{ secrets.ALWAYSDATA_DEPLOY_PATH }}
            npm ci --omit=dev

      - name: Restart site via AlwaysData API
        run: |
          curl --fail -X POST --basic --user "${{ secrets.ALWAYSDATA_API_KEY }} account=icare:" \
            "https://api.alwaysdata.com/v1/site/${{ secrets.ALWAYSDATA_SITE_LDQ_ID }}/restart/"
